<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Matbagy Orchestrator Core v0.1</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;background:#f5f6f8;color:#111827}
    main{max-width:1100px;margin:auto;padding:24px}
    .banner{padding:12px 16px;background:#fff3cd;border:1px solid #ffe69c;border-radius:10px;margin-bottom:16px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:16px}
    textarea{width:100%;min-height:360px;box-sizing:border-box;font:13px ui-monospace,monospace;direction:ltr;text-align:left}
    input{width:100%;box-sizing:border-box;padding:10px;margin:8px 0 12px}
    button{padding:10px 16px;border:0;border-radius:8px;cursor:pointer}
    pre{white-space:pre-wrap;word-break:break-word;direction:ltr;text-align:left;background:#111827;color:#f9fafb;padding:14px;border-radius:10px;min-height:280px}
    @media(max-width:800px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <h1>Matbagy Orchestrator Core v0.1</h1>
  <div class="banner">طبقة اختبار محلية فقط — بدون OpenAI/Gemini API، بدون Drive write، وبدون أسرار.</div>
  <div class="grid">
    <section class="card">
      <h2>Case JSON</h2>
      <textarea id="caseInput"></textarea>
      <label>طلب المستخدم</label>
      <input id="userRequest" value="@الكل راجعوا التصميم وحافظوا على الملامح" />
      <button id="run">تشغيل التحليل المحلي</button>
    </section>
    <section class="card">
      <h2>Runtime Output</h2>
      <pre id="output"></pre>
    </section>
  </div>
</main>
<script type="module">
import { buildPersistPlan, buildSharedContextPacket, routeMessage, validateCase } from './orchestrator-core.mjs';

const sample = {
  case_id: 'DESIGN-2026-000015',
  case_phase: 'UNDER_REVIEW',
  request_summary: 'تجربة Runtime محلية',
  customer_approval_status: 'NOT_DOCUMENTED',
  must_keep: ['ملامح الوجه'],
  must_avoid: ['فلاتر'],
  assets: [
    { asset_id: 'DESIGN-2026-000015-A001', asset_binding_status: 'LINKED', drive_file_id: 'DEMO_FILE_ID', source_role: 'customer_original' },
    { asset_id: 'DESIGN-2026-000015-A002', asset_binding_status: 'LINKED', drive_file_id: 'DEMO_RESULT_ID', source_role: 'generated_result' }
  ],
  versions: [
    { version_id: 'V1', result_status: 'SUCCESS', result_asset_id: 'DESIGN-2026-000015-A002', feedback_class: 'LIKED' }
  ]
};

caseInput.value = JSON.stringify(sample, null, 2);

run.addEventListener('click', () => {
  try {
    const data = JSON.parse(caseInput.value);
    const routing = routeMessage(userRequest.value);
    const result = {
      validation: validateCase(data),
      routing,
      persist_plan: buildPersistPlan(data),
      shared_context: buildSharedContextPacket({
        caseData: data,
        userRequest: userRequest.value,
        target: routing.mode === 'GEMINI' ? 'GEMINI' : routing.mode === 'BOOM' ? 'BOTH' : 'CHATGPT'
      })
    };
    output.textContent = JSON.stringify(result, null, 2);
  } catch (error) {
    output.textContent = `ERROR: ${error.message}`;
  }
});
</script>
</body>
</html>
